<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Phantom X</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
 margin:0;
 font-family:Arial;
 background:radial-gradient(circle,#0b0f1a,#020617);
 color:white;
 display:flex;
 justify-content:center;
 align-items:center;
 height:100vh;
}
.app{
 background:#111827;
 padding:20px;
 border-radius:20px;
 width:360px;
 box-shadow:0 0 40px #6366f155;
}
.box{
 background:#1f2937;
 padding:12px;
 border-radius:12px;
 margin-top:10px;
}
button{
 width:100%;
 padding:12px;
 border-radius:12px;
 border:none;
 background:linear-gradient(90deg,#6366f1,#8b5cf6);
 color:white;
 margin-top:10px;
 font-weight:bold;
}
input{
 width:100%;
 background:transparent;
 border:none;
 color:white;
}
.small{font-size:12px;opacity:0.7}
.logo{
 text-align:center;
 margin-bottom:10px;
}
.logo img{
 width:60px;
 border-radius:12px;
}
</style>
</head>

<body>

<div class="app">

<div class="logo">
<img src="https://i.imgur.com/8Km9tLL.png">
<h2>Phantom X</h2>
<div class="small">Powered by Delora</div>
</div>

<button onclick="connectWallet()">Connect Wallet</button>

<button onclick="setMode('swap')">Swap</button>
<button onclick="setMode('bridge')">Bridge</button>

<div class="box">
<input id="amount" placeholder="Amount">
</div>

<button onclick="openModal('from')" id="fromToken">Select Token</button>
<button onclick="openModal('to')" id="toToken">Select Token</button>

<div class="box">
Slippage <input id="slippage">
</div>

<button onclick="getQuote()">Get Price</button>

<p id="price">Price: -</p>
<p id="route" class="small">Route: -</p>
<p id="gas" class="small">Gas: -</p>

<button id="swapBtn" onclick="swap()">Execute</button>

<button onclick="toggleHistory()">History</button>
<button onclick="toggleSettings()">Settings</button>

<div id="historyBox" class="box" style="display:none;">
<h4>History</h4>
<div id="historyList"></div>
</div>

<div id="settingsBox" class="box" style="display:none;">
<h4>Settings</h4>
Slippage <input id="slippageSetting">
</div>

</div>

<!-- MODAL -->
<div id="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000000cc;">
<div style="background:#111827;margin:50px auto;padding:20px;width:90%;max-width:400px;border-radius:15px;">
<input id="search" placeholder="Search token..." style="width:100%;padding:10px;border-radius:10px;border:none;">
<div id="tokenList" style="max-height:300px;overflow:auto;"></div>
<button onclick="closeModal()">Close</button>
</div>
</div>

<script>
let provider,userAddress,txData;
let mode="swap";
let tokens=[],selectedType="",selectedFrom=null,selectedTo=null;

// WALLET
async function connectWallet(){
 if(window.okxwallet) provider=window.okxwallet;
 else if(window.ethereum) provider=window.ethereum;
 else return alert("Install wallet");

 const acc=await provider.request({method:"eth_requestAccounts"});
 userAddress=acc[0];
 alert("Connected: "+userAddress);
}

// MODE
function setMode(m){
 mode=m;
 document.getElementById("route").innerText="Mode: "+m;
}

// TOKEN LOAD
async function loadTokens(){
 try{
  const res=await fetch("https://tokens.coingecko.com/uniswap/all.json");
  const data=await res.json();
  tokens=data.tokens;
 }catch(e){console.log("token error");}
}
loadTokens();

// DEFAULT TOKEN
setTimeout(()=>{
 selectedFrom=tokens.find(t=>t.symbol==="ETH");
 selectedTo=tokens.find(t=>t.symbol==="USDT");

 if(selectedFrom) document.getElementById("fromToken").innerText=selectedFrom.symbol;
 if(selectedTo) document.getElementById("toToken").innerText=selectedTo.symbol;

 updateButton();
},1500);

// MODAL
function openModal(type){
 selectedType=type;
 document.getElementById("modal").style.display="block";
 renderTokens(tokens.slice(0,200));
}
function closeModal(){
 document.getElementById("modal").style.display="none";
}
// SEARCH
document.getElementById("search").addEventListener("input",e=>{
 const val=e.target.value.toLowerCase();
 const filtered=tokens.filter(t=>
  t.symbol.toLowerCase().includes(val) ||
  (t.name && t.name.toLowerCase().includes(val))
 );
 renderTokens(filtered.slice(0,200));
});

// RENDER TOKEN
function renderTokens(list){
 const el=document.getElementById("tokenList");
 el.innerHTML="";
 list.forEach(t=>{
  const div=document.createElement("div");
  div.style.display="flex";
  div.style.padding="8px";
  div.innerHTML=<img src="${t.logoURI}" width="24"> ${t.symbol};
  div.onclick=()=>selectToken(t);
  el.appendChild(div);
 });
}

// SELECT TOKEN
function selectToken(t){
 if(selectedType==="from"){
  if(selectedTo && selectedTo.address===t.address){
    alert("Token tidak boleh sama"); return;
  }
  selectedFrom=t;
  document.getElementById("fromToken").innerText=t.symbol;
 }else{
  if(selectedFrom && selectedFrom.address===t.address){
    alert("Token tidak boleh sama"); return;
  }
  selectedTo=t;
  document.getElementById("toToken").innerText=t.symbol;
 }
 closeModal();
 updateButton();
}

// BUTTON CONTROL
function updateButton(){
 const btn=document.getElementById("swapBtn");
 if(!selectedFrom||!selectedTo){
  btn.disabled=true;btn.style.opacity=0.5;
 }else{
  btn.disabled=false;btn.style.opacity=1;
 }
}

// SETTINGS
document.getElementById("slippageSetting").value=localStorage.getItem("slippage")||"0.5";
document.getElementById("slippageSetting").addEventListener("input",e=>{
 localStorage.setItem("slippage",e.target.value);
});
document.getElementById("slippage").value=localStorage.getItem("slippage")||"0.5";

function toggleSettings(){
 const box=document.getElementById("settingsBox");
 box.style.display=box.style.display==="none"?"block":"none";
}
function toggleHistory(){
 const box=document.getElementById("historyBox");
 box.style.display=box.style.display==="none"?"block":"none";
}

// HISTORY
let history=JSON.parse(localStorage.getItem("txHistory")||"[]");

function saveHistory(hash){
 const item={
  hash,
  from:selectedFrom.symbol,
  to:selectedTo.symbol,
  amount:document.getElementById("amount").value,
  time:new Date().toLocaleString()
 };
 history.unshift(item);
 localStorage.setItem("txHistory",JSON.stringify(history));
 renderHistory();
}

function renderHistory(){
 const el=document.getElementById("historyList");
 el.innerHTML="";
 history.forEach(h=>{
  const div=document.createElement("div");
  div.innerHTML=
  <div>${h.amount} ${h.from} → ${h.to}</div>
  <div class="small">${h.time}</div>
  <div class="small">${h.hash}</div>;
  el.appendChild(div);
 });
}
renderHistory();

// QUOTE
async function getQuote(){
 if(!selectedFrom||!selectedTo) return alert("Select token");

 const amount=document.getElementById("amount").value;
 const slippage=localStorage.getItem("slippage")||"0.5";

 document.getElementById("price").innerText="Loading...";

 try{
  const endpoint=mode==="swap"
   ?"https://api.delora.xyz/v1/swap"
   :"https://api.delora.xyz/v1/bridge";

  const res=await fetch(endpoint,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "x-api-key":"YOUR_API_KEY"
   },
   body:JSON.stringify({
    fromToken:selectedFrom.address,
    toToken:selectedTo.address,
    amount,
    slippage,
    user:userAddress
   })
  });

  const data=await res.json();
  txData=data.tx;

  document.getElementById("price").innerText="Receive: "+data.toAmount;
  document.getElementById("route").innerText="Route: "+data.route;
  document.getElementById("gas").innerText="Gas: "+data.gas;

 }catch(e){
  document.getElementById("price").innerText="Waiting API...";
 }
}

// EXECUTE
async function swap(){
 if(!txData) return alert("Get price first");

 const tx=await provider.request({
  method:"eth_sendTransaction",
  params:[txData]
 });

 saveHistory(tx);
 alert("TX: "+tx);
}
</script>

</body>
</html>
