<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Phantom X Delora</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0f1a;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.app {
  background: #111827;
  padding: 20px;
  border-radius: 20px;
  width: 360px;
}

.box {
  background: #1f2937;
  padding: 12px;
  border-radius: 12px;
  margin-top: 10px;
}

input, select {
  width: 100%;
  background: transparent;
  border: none;
  color: white;
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: #6366f1;
  color: white;
  margin-top: 10px;
}

.small {
  font-size: 12px;
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="app">
  <h2>⚡ Phantom X Delora</h2>

  <button onclick="connectWallet()">Connect Wallet</button>

  <div class="box">
    <input id="amount" placeholder="Amount">
  </div>

  <div class="box">
    <select id="fromToken"></select>
  </div>

  <div class="box">
    <select id="toToken"></select>
  </div>

  <div class="box">
    Slippage:
    <input id="slippage" value="0.5"> %
  </div>

  <button onclick="getQuote()">Get Price</button>

  <p id="price">Price: -</p>
  <p id="route" class="small">Route: -</p>
  <p id="gas" class="small">Gas: -</p>

  <button onclick="swap()">Swap</button>
</div>

<script>
let provider;
let userAddress = "";
let txData = null;

// 🔗 TOKEN LIST (REAL)
const tokens = [
  { symbol: "ETH", address: "0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee" },
  { symbol: "USDT", address: "0xdAC17F958D2ee523a2206206994597C13D831ec7" },
  { symbol: "USDC", address: "0xA0b86991c6218b36c1d19d4a2e9eb0ce3606eb48" }
];

// load token dropdown
function loadTokens() {
  const from = document.getElementById("fromToken");
  const to = document.getElementById("toToken");

  tokens.forEach(t => {
    let opt1 = document.createElement("option");
    opt1.value = t.address;
    opt1.innerText = t.symbol;

    let opt2 = document.createElement("option");
    opt2.value = t.address;
    opt2.innerText = t.symbol;

    from.appendChild(opt1);
    to.appendChild(opt2);
  });
}

loadTokens();

// 🔥 CONNECT WALLET
async function connectWallet() {
  if (window.ethereum) {
    provider = window.ethereum;

    const acc = await provider.request({
      method: "eth_requestAccounts"
    });

    userAddress = acc[0];
    alert("Connected: " + userAddress);
  } else {
    alert("Install wallet");
  }
}

// 💰 GET QUOTE
async function getQuote() {
  const amount = document.getElementById("amount").value;
  const fromToken = document.getElementById("fromToken").value;
  const toToken = document.getElementById("toToken").value;
  const slippage = document.getElementById("slippage").value;

  document.getElementById("price").innerText = "Loading...";
  document.getElementById("route").innerText = "...";

  try {
    const res = await fetch("https://api.delora.xyz/v1/quote", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": "YOUR_API_KEY"
      },
      body: JSON.stringify({
        fromToken,
        toToken,
        amount,
        slippage,
        user: userAddress
      })
    });

    const data = await res.json();

    txData = data.tx;

    document.getElementById("price").innerText =
      "Receive: " + data.toAmount;

    document.getElementById("route").innerText =
      "Route: " + data.route;

    document.getElementById("gas").innerText =
      "Gas: " + data.gas;

  } catch (err) {
    document.getElementById("price").innerText =
      "API belum aktif";
  }
}

// ⚡ SWAP
async function swap() {
  if (!txData) {
    alert("Get price dulu");
    return;
  }

  try {
    const tx = await provider.request({
      method: "eth_sendTransaction",
      params: [txData]
    });

    alert("TX: " + tx);
  } catch (err) {
    alert("Swap gagal");
  }
}
</script>

</body>
</html>
