<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phantom X Delora</title>

<style>
body{
 margin:0;background:#0b0f1a;color:white;font-family:Arial;
 display:flex;justify-content:center;align-items:center;height:100vh;
}
.app{
 width:360px;background:#111827;padding:20px;border-radius:20px;
 box-shadow:0 0 40px rgba(99,102,241,0.4);
}
.header{text-align:center;}
.logo{
 width:60px;height:60px;border-radius:15px;
 background:linear-gradient(135deg,#6366f1,#8b5cf6);
 display:flex;align-items:center;justify-content:center;margin:auto;font-weight:bold;
}
.box{
 background:#1f2937;padding:12px;border-radius:12px;margin-top:10px;
}
button{
 width:100%;padding:12px;border:none;border-radius:12px;
 background:#6366f1;color:white;margin-top:10px;
}
input,select{
 width:100%;background:none;border:none;color:white;
}
.small{font-size:12px;opacity:0.7}

/* modal */
.modal{
 display:none;position:fixed;top:0;left:0;width:100%;height:100%;
 background:#000000cc;
}
.modal-box{
 background:#111827;margin:50px auto;padding:20px;width:90%;
 max-width:400px;border-radius:15px;
}
.token-item{
 padding:10px;border-bottom:1px solid #333;cursor:pointer;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<div class="logo">PX</div>
<h2>Phantom X Delora</h2>
<div class="small">Powered by Delora</div>
</div>

<button onclick="connect()">Connect Wallet</button>

<div class="box">Balance: <span id="balance">-</span></div>

<div class="box"><input id="amount" placeholder="Amount"></div>

<div class="box">From <button onclick="openModal('from')" id="from">ETH</button></div>
<div class="box">To <button onclick="openModal('to')" id="to">USDT</button></div>

<div class="box">
Chain
<select id="chain">
<option value="1">Ethereum</option>
<option value="56">BSC</option>
<option value="137">Polygon</option>
<option value="8453">Base</option>
<option value="42161">Arbitrum</option>
<option value="10">Optimism</option>
</select>
</div>

<button onclick="getRoute()">Get Route</button>

<p id="result">Route: -</p>
<p id="gas" class="small"></p>

<button onclick="execute()">Execute</button>

<button onclick="toggleHistory()">History</button>

<div id="historyBox" class="box" style="display:none;"></div>

</div>

<!-- MODAL TOKEN -->
<div class="modal" id="modal">
<div class="modal-box">
<input id="search" placeholder="Search token">
<div id="list"></div>
<button onclick="closeModal()">Close</button>
</div>
</div>

<script>
let user,routeData;
let tokens=[];
let selectedType="";
let fromToken="0x0000000000000000000000000000000000000000";
let toToken="0xdAC17F958D2ee523a2206206994597C13D831ec7";
let history=JSON.parse(localStorage.getItem("history")||"[]");

// CONNECT
async function connect(){
 if(!window.ethereum) return alert("Install wallet");
 const acc=await window.ethereum.request({method:"eth_requestAccounts"});
 user=acc[0];

 const bal=await window.ethereum.request({
  method:"eth_getBalance",
  params:[user,"latest"]
 });

 document.getElementById("balance").innerText=(bal/1e18).toFixed(4)+" ETH";
}

// LOAD TOKEN LIST
async function loadTokens(){
 let res=await fetch("https://tokens.coingecko.com/uniswap/all.json");
 let data=await res.json();
 tokens=data.tokens;
}
loadTokens();

// MODAL
function openModal(type){
 selectedType=type;
 document.getElementById("modal").style.display="block";
 render(tokens.slice(0,200));
}
function closeModal(){
 document.getElementById("modal").style.display="none";
}

// SEARCH
document.getElementById("search").oninput=e=>{
 let val=e.target.value.toLowerCase();
 let filtered=tokens.filter(t=>
  t.symbol.toLowerCase().includes(val) ||
  t.name.toLowerCase().includes(val)
 );
 render(filtered.slice(0,200));
};

// RENDER TOKEN
function render(list){
 let el=document.getElementById("list");
 el.innerHTML="";
 list.forEach(t=>{
  let div=document.createElement("div");
  div.className="token-item";
  div.innerText=t.symbol+" - "+t.name;
  div.onclick=()=>selectToken(t);
  el.appendChild(div);
 });
}
// SELECT TOKEN
function selectToken(t){
 if(selectedType==="from"){
  fromToken=t.address;
  document.getElementById("from").innerText=t.symbol;
 }else{
  toToken=t.address;
  document.getElementById("to").innerText=t.symbol;
 }
 closeModal();
}

// GET ROUTE (REAL)
async function getRoute(){
 let amount=document.getElementById("amount").value;
 let chain=document.getElementById("chain").value;

 if(!amount) return alert("Masukkan amount");

 document.getElementById("result").innerText="Loading...";

 try{
  const res=await fetch(https://li.quest/v1/quote?fromChain=${chain}&toChain=${chain}&fromToken=${fromToken}&toToken=${toToken}&fromAmount=${amount*1e18}&fromAddress=${user});
  const data=await res.json();

  routeData=data;

  document.getElementById("result").innerText="Receive: "+data.toAmount;
  document.getElementById("gas").innerText="Gas: "+(data.estimate?.gasCosts?.[0]?.amount||"-");

 }catch(e){
  document.getElementById("result").innerText="Error route";
 }
}

// EXECUTE REAL TX
async function execute(){
 if(!routeData) return alert("Get route dulu");

 const tx=await window.ethereum.request({
  method:"eth_sendTransaction",
  params:[routeData.transactionRequest]
 });

 saveHistory(tx);
 alert("TX: "+tx);
}

// HISTORY
function saveHistory(tx){
 history.unshift({tx,time:new Date().toLocaleString()});
 localStorage.setItem("history",JSON.stringify(history));
 renderHistory();
}

function renderHistory(){
 let el=document.getElementById("historyBox");
 el.innerHTML="";
 history.forEach(h=>{
  el.innerHTML+=<div>${h.tx}<br><span class="small">${h.time}</span></div>;
 });
}
renderHistory();

function toggleHistory(){
 let box=document.getElementById("historyBox");
 box.style.display=box.style.display==="none"?"block":"none";
}
</script>

</body>
</html>
